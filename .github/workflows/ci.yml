name: CivicPlus CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend Microservices
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # DOCKER AUTO-PUSH STEPS START HERE

      # DEBUG STEP: Check Secret Lengths
      - name: Debug Secrets Format
        run: |
          echo "Username length: ${#DOCKER_USER}"
          echo "Password length: ${#DOCKER_PASS}"
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Images to Docker Hub
        run: |
          # 1. Core Cloud Services
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:config-server -f config-server/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:config-server

          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:discovery-server -f discovery-server/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:discovery-server

          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:api-gateway -f api-gateway/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:api-gateway

          # 2. Domain Microservices
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:auth-service -f auth-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:auth-service

          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:user-service -f user-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:user-service

          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:complaint-service -f complaint-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:complaint-service

          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:department-service -f department-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:department-service

          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:media-service -f media-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:media-service

          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:notification-service -f notification-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:notification-service

          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:analytics-service -f analytics-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:analytics-service

          # 3. Frontend (Updated context to ./frontend)
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:frontend -f frontend/Dockerfile ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:frontend