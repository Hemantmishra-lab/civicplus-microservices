name: CivicPlus CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend Microservices
        run: ./mvnw clean package -DskipTests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # 🔥 DOCKER AUTO-PUSH STEPS START HERE 🔥

      # 🔍 DEBUG STEP: Check if secrets are loaded properly
      - name: Debug Secret Availability
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then 
            echo "❌ DOCKER_USERNAME IS EMPTY OR NOT FOUND"; 
          else 
            echo "✅ DOCKER_USERNAME IS SET"; 
          fi

          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then 
            echo "❌ DOCKER_PASSWORD IS EMPTY OR NOT FOUND"; 
          else 
            echo "✅ DOCKER_PASSWORD IS SET"; 
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Images to Docker Hub
        run: |
          # 1. Core Cloud Services
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:config-server ./config-server
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:config-server
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:discovery-server ./discovery-server
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:discovery-server
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:api-gateway ./api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:api-gateway
          
          # 2. Domain Microservices
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:auth-service ./auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:auth-service
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:user-service ./user-service
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:user-service
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:complaint-service ./complaint-service
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:complaint-service
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:department-service ./department-service
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:department-service
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:media-service ./media-service
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:media-service
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:notification-service ./notification-service
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:notification-service
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:analytics-service ./analytics-service
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:analytics-service
          
          # 3. Frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:frontend ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/civicplus-repo:frontend